<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Flashcards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Audio Flashcards</h1>
    <nav>
      <button data-view="add" class="active">Add card</button>
      <button data-view="list">Deck</button>
      <button data-view="review">Review</button>
    </nav>
  </header>

  <main>
    <!-- Add / edit a card -->
    <section id="view-add" class="view">
      <form id="card-form">
        <input type="hidden" name="cardId">
        <label>Language
          <input name="language" list="languages" placeholder="Cantonese" required>
          <datalist id="languages"></datalist>
        </label>
        <label>Written form
          <input name="native" placeholder="你好" required>
        </label>
        <label>Romanization (optional)
          <input name="romanization" placeholder="nei5 hou2">
        </label>
        <label>English meaning
          <input name="english" placeholder="Hello" required>
        </label>
        <label>Notes (optional)
          <textarea name="notes" rows="2"></textarea>
        </label>
        <fieldset>
          <legend>Audio</legend>
          <input type="file" name="audio" accept="audio/*">
          <button type="button" id="record-btn">● Record</button>
          <audio id="audio-preview" controls hidden></audio>
        </fieldset>
        <div class="actions">
          <button type="submit">Save card</button>
          <button type="reset" id="cancel-edit">Clear</button>
        </div>
      </form>
    </section>

    <!-- Deck -->
    <section id="view-list" class="view" hidden>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search…">
        <select id="filter-language"><option value="">All languages</option></select>
        <button id="export-btn">Export</button>
        <label class="file-btn">Import<input id="import-input" type="file" accept=".json" hidden></label>
      </div>
      <ul id="card-list"></ul>
    </section>

    <!-- Review -->
    <section id="view-review" class="view" hidden>
      <div class="toolbar">
        <select id="review-language"><option value="">All languages</option></select>
        <select id="review-mode">
          <option value="audio">Audio → meaning</option>
          <option value="native">Written → meaning</option>
          <option value="english">English → written</option>
        </select>
        <button id="start-review">Start</button>
      </div>
      <div id="review-card" hidden>
        <div id="review-prompt"></div>
        <div id="review-answer" hidden></div>
        <div class="actions">
          <button id="reveal-btn">Show answer</button>
          <button id="again-btn" hidden>Again</button>
          <button id="good-btn" hidden>Got it</button>
        </div>
        <p id="review-progress"></p>
      </div>
      <p id="review-empty" hidden>Nothing to review. Add some cards first.</p>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
